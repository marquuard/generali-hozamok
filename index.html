<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Generali eszközalapok éves hozamának nyomon követése."
  >

  <title>Generali eszközalapok – YTD hozam</title>

  <script>
    // A mentett téma az oldal megjelenése előtt betöltődik,
    // így nem villan fel a világos mód sötét mód helyett.
    (function () {
      const savedTheme =
        localStorage.getItem("generali-theme");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    html {
      background: #f4f7fb;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f4f7fb 0%,
          #eef2f7 100%
        );

      color: #172033;

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }


    /* ======================================================
       DARK MODE
       ====================================================== */

    html.dark {
      background: #0f172a;
    }

    html.dark body {
      background:
        linear-gradient(
          180deg,
          #0f172a 0%,
          #111827 100%
        );

      color: #e5e7eb;
    }

    html.dark .eyebrow {
      color: #94a3b8;
    }

    html.dark .subtitle {
      color: #94a3b8;
    }

    html.dark .card {
      background: #1e293b;

      border-color: #334155;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.28);
    }

    html.dark .controls {
      border-color: #334155;
    }

    html.dark #search {
      background: #0f172a;

      border-color: #475569;

      color: #e5e7eb;
    }

    html.dark #search::placeholder {
      color: #64748b;
    }

    html.dark #search:focus {
      border-color: #94a3b8;

      box-shadow:
        0 0 0 3px rgba(148, 163, 184, 0.12);
    }

    html.dark .search-icon {
      color: #64748b;
    }

    html.dark #clearSearch {
      color: #94a3b8;
    }

    html.dark #clearSearch:hover {
      background: #334155;
    }

    html.dark .search-info {
      color: #94a3b8;
    }

    html.dark #fundSelect {
      background: #0f172a;

      border-color: #475569;

      color: #e5e7eb;
    }

    html.dark #fundSelect:focus {
      border-color: #94a3b8;

      box-shadow:
        0 0 0 3px rgba(148, 163, 184, 0.12);
    }

    html.dark .result-label {
      color: #94a3b8;
    }

    html.dark #value {
      color: #94a3b8;
    }

    html.dark .date {
      background: #334155;

      color: #cbd5e1;
    }

    html.dark .footer {
      color: #64748b;
    }

    html.dark .empty {
      color: #94a3b8;
    }

    html.dark .error {
      background: #450a0a;

      color: #fecaca;
    }


    /* ======================================================
       OLDAL
       ====================================================== */

    .page {
      width: min(760px, calc(100% - 32px));

      margin: 0 auto;

      padding: 48px 0 64px;
    }

    .header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin-bottom: 10px;

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: #64748b;

      transition:
        color 0.25s ease;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.1;

      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 12px 0 0;

      color: #64748b;

      font-size: 16px;
      line-height: 1.6;

      transition:
        color 0.25s ease;
    }

    .card {
      background: #ffffff;

      border: 1px solid #e2e8f0;
      border-radius: 20px;

      box-shadow:
        0 12px 35px rgba(15, 23, 42, 0.08);

      overflow: hidden;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .controls {
      padding: 22px;

      border-bottom: 1px solid #e2e8f0;

      transition:
        border-color 0.25s ease;
    }

    .search-wrapper {
      position: relative;
    }

    #search {
      width: 100%;

      min-height: 52px;

      padding:
        0 48px
        0 44px;

      border: 1px solid #cbd5e1;
      border-radius: 12px;

      background: #ffffff;

      color: #172033;

      font-size: 16px;

      outline: none;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    #search:focus {
      border-color: #64748b;

      box-shadow:
        0 0 0 3px rgba(100, 116, 139, 0.12);
    }

    .search-icon {
      position: absolute;

      left: 16px;
      top: 50%;

      transform: translateY(-50%);

      color: #94a3b8;

      font-size: 18px;

      pointer-events: none;
    }

    #clearSearch {
      position: absolute;

      right: 8px;
      top: 50%;

      transform: translateY(-50%);

      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 8px;

      background: transparent;

      color: #64748b;

      font-size: 18px;

      cursor: pointer;

      display: none;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    #clearSearch:hover {
      background: #f1f5f9;
    }

    .search-info {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      margin-top: 10px;

      color: #64748b;

      font-size: 13px;
    }

    #fundCount {
      font-weight: 600;
    }

    #fundSelect {
      width: 100%;

      min-height: 52px;

      margin-top: 16px;

      padding: 0 14px;

      border: 1px solid #cbd5e1;
      border-radius: 12px;

      background: #ffffff;

      color: #172033;

      font-size: 16px;

      outline: none;

      cursor: pointer;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    #fundSelect:focus {
      border-color: #64748b;

      box-shadow:
        0 0 0 3px rgba(100, 116, 139, 0.12);
    }

    .result {
      padding: 34px 22px 30px;

      text-align: center;
    }

    .result-label {
      margin-bottom: 10px;

      color: #64748b;

      font-size: 14px;
      font-weight: 600;
    }

    #fundName {
      margin: 0 auto;

      max-width: 620px;

      font-size: clamp(20px, 4vw, 28px);
      line-height: 1.3;

      letter-spacing: -0.02em;
    }

    .return-box {
      margin-top: 28px;
    }

    #returnValue {
      display: inline-block;

      font-size: clamp(42px, 11vw, 78px);
      line-height: 1;

      font-weight: 800;

      letter-spacing: -0.05em;
    }

    #returnValue.positive {
      color: #15803d;
    }

    #returnValue.negative {
      color: #dc2626;
    }

    #returnValue.no-data {
      color: #64748b;

      font-size: clamp(32px, 8vw, 54px);

      letter-spacing: -0.03em;
    }

    html.dark #returnValue.no-data {
      color: #94a3b8;
    }

    #value {
      display: block;

      margin-top: 8px;

      color: #64748b;

      font-size: 14px;
      font-weight: 500;

      transition:
        color 0.25s ease;
    }

    .date {
      margin-top: 24px;

      display: inline-flex;

      align-items: center;

      min-height: 32px;

      padding: 0 12px;

      border-radius: 999px;

      background: #f1f5f9;

      color: #64748b;

      font-size: 12px;
      font-weight: 600;

      transition:
        background 0.25s ease,
        color 0.25s ease;
    }

    .footer {
      margin-top: 18px;

      text-align: center;

      color: #94a3b8;

      font-size: 12px;
      line-height: 1.5;
    }

    .error {
      padding: 28px 22px;

      color: #b91c1c;

      background: #fef2f2;

      text-align: center;

      line-height: 1.6;
    }

    .empty {
      padding: 30px 20px;

      color: #64748b;

      text-align: center;
    }


    /* ======================================================
       TÉMAKAPCSOLÓ
       ====================================================== */

    #themeToggle {
      position: fixed;

      right: 18px;
      bottom: 18px;

      width: 46px;
      height: 46px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: 1px solid #cbd5e1;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.94);

      color: #334155;

      box-shadow:
        0 5px 18px rgba(15, 23, 42, 0.14);

      cursor: pointer;

      z-index: 1000;

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.15s ease;
    }

    #themeToggle:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 22px rgba(15, 23, 42, 0.18);
    }

    #themeToggle:active {
      transform: translateY(0);
    }

    #themeToggle:focus-visible {
      outline: 3px solid rgba(100, 116, 139, 0.3);

      outline-offset: 3px;
    }

    html.dark #themeToggle {
      background: rgba(30, 41, 59, 0.94);

      border-color: #475569;

      color: #f8fafc;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.35);
    }

    .theme-icon {
      width: 21px;
      height: 21px;

      display: block;

      fill: currentColor;
    }

    .sun-icon {
      display: block;
    }

    .moon-icon {
      display: none;
    }

    html.dark .sun-icon {
      display: none;
    }

    html.dark .moon-icon {
      display: block;
    }


    /* ======================================================
       MOBIL
       ====================================================== */

    @media (max-width: 560px) {

      .page {
        width: min(
          100% - 20px,
          760px
        );

        padding-top: 28px;
        padding-bottom: 80px;
      }

      .controls {
        padding: 16px;
      }

      .result {
        padding:
          28px 16px
          24px;
      }

      .search-info {
        align-items: flex-start;

        flex-direction: column;
      }

      #themeToggle {
        right: 14px;
        bottom: 14px;

        width: 44px;
        height: 44px;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="eyebrow">
        Generali eszközalapok
      </div>

      <h1>
        Éves hozam
      </h1>

      <p class="subtitle">
        Forint alapú eszközalapok II. –
        év elejétől számított, nem évesített hozam.
      </p>

    </header>


    <section class="card">

      <div class="controls">

        <div class="search-wrapper">

          <span
            class="search-icon"
            aria-hidden="true"
          >
            ⌕
          </span>

          <input
            id="search"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Keresés az alapok között..."
            aria-label="Eszközalap keresése"
          >

          <button
            id="clearSearch"
            type="button"
            aria-label="Keresés törlése"
          >
            ×
          </button>

        </div>

        <div class="search-info">

          <span id="fundCount">
            Betöltés...
          </span>

          <span>
            Gépelés közben automatikusan szűr
          </span>

        </div>

        <select
          id="fundSelect"
          aria-label="Eszközalap kiválasztása"
        >
          <option value="">
            Eszközalap kiválasztása...
          </option>
        </select>

      </div>


      <div
        id="content"
        class="result"
      >

        <div class="result-label">
          Kiválasztott eszközalap
        </div>

        <h2 id="fundName">
          —
        </h2>

        <div class="return-box">

          <span id="returnValue">
            —
          </span>

          <span id="value">
            Év elejétől számított hozam
          </span>

        </div>

        <div
          id="dateBadge"
          class="date"
        >
          —
        </div>

      </div>

    </section>


    <div class="footer">
      Az adatok a Generali hivatalos oldaláról
      automatikusan frissülnek.
    </div>

  </main>


  <!-- ======================================================
       TÉMAKAPCSOLÓ
       ====================================================== -->

  <button
    id="themeToggle"
    type="button"
    aria-label="Sötét mód bekapcsolása"
    title="Sötét mód"
  >

    <!-- Nap ikon – világos módban látható -->
    <svg
      class="theme-icon sun-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="
        M12 4V2
        M12 22V20
        M4 12H2
        M22 12H20
        M5.64 5.64L4.22 4.22
        M19.78 19.78L18.36 18.36
        M5.64 18.36L4.22 19.78
        M19.78 4.22L18.36 5.64
        M12 17
        A5 5 0 1 0 12 7
        A5 5 0 0 0 12 17
      "
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      />
    </svg>

    <!-- Hold ikon – sötét módban látható -->
    <svg
      class="theme-icon moon-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="
          M20.5 14.5
          A8.5 8.5 0 0 1
          9.5 3.5
          A8.5 8.5 0 1 0
          20.5 14.5
          Z
        "
      />
    </svg>

  </button>


  <script>

    /* ======================================================
       TÉMA
       ====================================================== */

    const themeToggle =
      document.getElementById(
        "themeToggle"
      );


    function updateThemeButton() {

      const isDark =
        document.documentElement
          .classList
          .contains("dark");


      if (isDark) {

        themeToggle.setAttribute(
          "aria-label",
          "Világos mód bekapcsolása"
        );

        themeToggle.setAttribute(
          "title",
          "Világos mód"
        );

      } else {

        themeToggle.setAttribute(
          "aria-label",
          "Sötét mód bekapcsolása"
        );

        themeToggle.setAttribute(
          "title",
          "Sötét mód"
        );

      }

    }


    themeToggle.addEventListener(
      "click",
      () => {

        const isDark =
          document.documentElement
            .classList
            .toggle("dark");


        localStorage.setItem(
          "generali-theme",
          isDark
            ? "dark"
            : "light"
        );


        updateThemeButton();

      }
    );


    updateThemeButton();


    /* ======================================================
       ESZKÖZALAPOK
       ====================================================== */

    const searchInput =
      document.getElementById("search");

    const clearSearch =
      document.getElementById("clearSearch");

    const fundCount =
      document.getElementById("fundCount");

    const fundSelect =
      document.getElementById("fundSelect");

    const fundName =
      document.getElementById("fundName");

    const returnValue =
      document.getElementById("returnValue");

    const value =
      document.getElementById("value");

    const dateBadge =
      document.getElementById("dateBadge");

    const content =
      document.getElementById("content");


    let funds = [];

    let filteredFunds = [];


    // Ékezetek nélküli keresés:
    // "kotveny" megtalálja a "kötvény" szót,
    // "reszveny" megtalálja a "részvény" szót.
    function normalizeText(text) {

      return String(text || "")
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .toLowerCase()
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    function formatYtd(number) {

      return Number(number).toLocaleString(
        "hu-HU",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
          signDisplay: "always"
        }
      ) + " %";

    }


    function showFund(fund) {

      if (!fund) {

        fundName.textContent =
          "Nincs kiválasztott eszközalap";

        returnValue.textContent =
          "—";

        returnValue.classList.remove(
          "positive",
          "negative",
          "no-data"
        );

        value.textContent =
          "Válassz egy eszközalapot a listából.";

        dateBadge.textContent =
          "—";

        return;
      }


      fundName.textContent =
        fund.name;


      const numericValue =
        typeof fund.ytd === "number"
          ? fund.ytd
          : Number(
              String(fund.ytd)
                .replace(",", ".")
            );


      returnValue.classList.remove(
        "positive",
        "negative",
        "no-data"
      );


      if (
        fund.ytd === null ||
        fund.ytd === undefined ||
        !Number.isFinite(numericValue)
      ) {

        returnValue.textContent =
          "Nincs adat";

        returnValue.classList.add(
          "no-data"
        );

        value.textContent =
          "Jelenleg nincs elérhető YTD hozam.";

      } else {

        returnValue.textContent =
          formatYtd(numericValue);

        returnValue.classList.add(
          numericValue >= 0
            ? "positive"
            : "negative"
        );

        value.textContent =
          "Év elejétől számított hozam (nem évesített)";
      }


      if (fund.date) {

        dateBadge.textContent =
          "Értéknap: " + fund.date;

      } else {

        dateBadge.textContent =
          "Értéknap: nincs adat";

      }

    }


    function renderSelect() {

      const previousValue =
        fundSelect.value;

      fundSelect.innerHTML = "";


      if (filteredFunds.length === 0) {

        const option =
          document.createElement("option");

        option.value = "";

        option.textContent =
          "Nincs találat";

        fundSelect.appendChild(
          option
        );

        fundCount.textContent =
          "0 találat";

        showFund(null);

        return;
      }


      const firstOption =
        document.createElement("option");

      firstOption.value = "";

      firstOption.textContent =
        "Eszközalap kiválasztása...";

      fundSelect.appendChild(
        firstOption
      );


      filteredFunds.forEach(
        (fund) => {

          const option =
            document.createElement("option");

          option.value =
            fund.id;

          option.textContent =
            fund.name;

          fundSelect.appendChild(
            option
          );

        }
      );


      const stillExists =
        filteredFunds.some(
          (fund) =>
            fund.id === previousValue
        );


      if (stillExists) {

        fundSelect.value =
          previousValue;

      } else {

        fundSelect.value =
          "";

      }


      updateCount();
    }


    function updateCount() {

      const total =
        funds.length;

      const visible =
        filteredFunds.length;


      if (visible === total) {

        fundCount.textContent =
          `${total} eszközalap`;

      } else {

        fundCount.textContent =
          `${visible} / ${total} találat`;

      }

    }


    function applySearch() {

      const query =
        normalizeText(
          searchInput.value
        );


      clearSearch.style.display =
        query
          ? "block"
          : "none";


      if (!query) {

        filteredFunds =
          [...funds];

        renderSelect();

        return;
      }


      const words =
        query
          .split(" ")
          .filter(Boolean);


      filteredFunds =
        funds.filter(
          (fund) => {

            const name =
              normalizeText(
                fund.name
              );

            return words.every(
              (word) =>
                name.includes(word)
            );

          }
        );


      renderSelect();


      // Ha pontosan egy találat maradt,
      // automatikusan megjelenítjük.
      if (
        filteredFunds.length === 1
      ) {

        const fund =
          filteredFunds[0];

        fundSelect.value =
          fund.id;

        showFund(fund);

      } else {

        showFund(null);

      }

    }


    function findFundById(id) {

      return funds.find(
        (fund) =>
          fund.id === id
      ) || null;

    }


    async function loadFunds() {

      try {

        const response =
          await fetch(
            "./funds.json?v=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "A funds.json betöltése sikertelen."
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "A funds.json formátuma hibás."
          );

        }


        funds =
          data.filter(
            (fund) =>
              fund &&
              fund.id &&
              fund.name
          );


        filteredFunds =
          [...funds];


        renderSelect();


        if (funds.length === 0) {

          throw new Error(
            "Nem található egyetlen eszközalap sem."
          );

        }


      } catch (error) {

        console.error(error);

        content.className =
          "error";

        content.innerHTML = `
          Nem sikerült betölteni az
          eszközalapok adatait.
          <br><br>
          Kérlek, próbáld újra később.
        `;

        fundCount.textContent =
          "Betöltési hiba";

      }

    }


    searchInput.addEventListener(
      "input",
      applySearch
    );


    clearSearch.addEventListener(
      "click",
      () => {

        searchInput.value = "";

        applySearch();

        searchInput.focus();

      }
    );


    fundSelect.addEventListener(
      "change",
      () => {

        const selectedId =
          fundSelect.value;

        const fund =
          findFundById(
            selectedId
          );

        showFund(fund);

      }
    );


    loadFunds();

  </script>

</body>
</html>
