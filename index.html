<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generali eszközalapok</title>

  <script>
    (function () {
      try {
        if (localStorage.getItem("generali-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #161616;
      --muted: #6c727a;
      --border: #dfe2e6;
      --input: #ffffff;
      --accent: #b21f2d;
      --positive: #16833b;
      --negative: #bd1e2d;
      --shadow: 0 10px 35px rgba(0,0,0,.08);
      --item-bg: #f8f9fa;
    }

    html.dark {
      --bg: #111315;
      --card: #1b1e21;
      --text: #f2f4f5;
      --muted: #aeb5bb;
      --border: #343a40;
      --input: #24282c;
      --accent: #ef5262;
      --positive: #49c978;
      --negative: #ff6878;
      --shadow: 0 10px 35px rgba(0,0,0,.35);
      --item-bg: #24282c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background .2s, color .2s;
    }

    .page {
      width: min(1100px, calc(100% - 28px));
      margin: 35px auto 70px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 6px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .last-update {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .last-update strong {
      color: var(--text);
    }

    /* Saját portfólió gomb és lista stílus */
    .my-portfolio-wrap {
      margin-bottom: 22px;
    }

    .my-portfolio-btn {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 18px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color .2s, background-color .2s;
    }

    .my-portfolio-btn:hover {
      border-color: var(--accent);
    }

    .my-portfolio-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      transition: transform .2s ease;
    }

    .my-portfolio-btn.open svg {
      transform: rotate(180deg);
    }

    .my-portfolio-list {
      display: none;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--item-bg);
      padding: 10px 14px;
    }

    .my-portfolio-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 6px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }

    .my-portfolio-item:last-child {
      border-bottom: none;
    }

    .my-portfolio-name {
      font-weight: 500;
    }

    .my-portfolio-ytd {
      font-weight: 700;
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-wrap {
      position: relative;
    }

    #search,
    #fundSelect {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--input);
      color: var(--text);
      padding: 13px 15px;
      font-size: 16px;
      outline: none;
    }

    #search:focus,
    #fundSelect:focus {
      border-color: var(--accent);
    }

    #search {
      padding-right: 48px;
    }

    #clearSearch {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 20px;
      display: none;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .result {
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 25px;
    }

    #fundName {
      margin: 0;
      font-size: 23px;
    }

    .date {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .ytd-label {
      margin-top: 25px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #returnValue {
      margin: 5px 0 0;
      font-size: 46px;
      font-weight: 700;
    }

    .positive { color: var(--positive) !important; }
    .negative { color: var(--negative) !important; }
    .neutral { color: var(--muted) !important; }

    .reference {
      margin: 24px auto 0;
      max-width: 850px;
      padding: 15px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: left;
    }

    .reference-title {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .reference-value {
      font-weight: 600;
      line-height: 1.45;
    }

    .portfolio {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 25px;
    }

    .portfolio h2 {
      margin: 0;
      font-size: 19px;
      text-align: left;
    }

    .portfolio-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    /* Görgetősáv teljes elrejtése */
    .chart-wrap {
      width: 100%;
      overflow: hidden;
      margin-top: 10px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .chart-wrap::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .portfolio-image {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
      background: transparent;
      cursor: zoom-in;
      transition: transform .15s ease;
    }

    .portfolio-image:hover {
      transform: scale(1.01);
    }

    .portfolio-empty {
      display: none;
      color: var(--muted);
      text-align: center;
      padding: 40px 10px;
    }

    .source {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .source a {
      color: var(--accent);
    }

    .error {
      color: var(--negative);
      padding: 20px;
      text-align: center;
    }

    /* Lightbox kinagyítás stílus */
    #imageModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 20px;
    }

    #imageModal img {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      cursor: zoom-out;
      border-radius: 12px;
    }

    #themeToggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 10;
    }

    #themeToggle svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    @media (min-width: 700px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .page {
        margin-top: 15px;
        width: min(100% - 16px, 1100px);
      }

      .card {
        padding: 18px 14px;
        border-radius: 14px;
      }

      h1 { font-size: 21px; }
      #returnValue { font-size: 38px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <h1>Generali eszközalapok</h1>
      <p class="subtitle">Forint alapú eszközalapok II. · év elejétől számított hozam</p>
      <div class="last-update">
        Adatok utolsó frissítése: <strong id="workflow-last-run">Lekérés...</strong>
      </div>

      <!-- Saját portfólió lenyíló modul -->
      <div class="my-portfolio-wrap">
        <button id="myPortfolioBtn" class="my-portfolio-btn" type="button">
          <span>💼 Saját portfólióm</span>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="myPortfolioList" class="my-portfolio-list"></div>
      </div>

      <div class="controls">
        <div>
          <div class="search-wrap">
            <input id="search" type="search" placeholder="Eszközalap keresése..." autocomplete="off">
            <button id="clearSearch" type="button" aria-label="Keresés törlése">×</button>
          </div>
          <div id="resultCount" class="result-count"></div>
        </div>

        <select id="fundSelect" aria-label="Eszközalap kiválasztása"></select>
      </div>

      <div id="content">
        <div class="result">
          <h2 id="fundName">Betöltés...</h2>
          <div id="dateBadge" class="date"></div>
          <div class="ytd-label">YTD hozam</div>
          <div id="returnValue" class="neutral">–</div>

          <div class="reference">
            <div class="reference-title">Referenciaindex</div>
            <div id="referenceValue" class="reference-value">–</div>
          </div>

          <div class="portfolio">
            <h2>Portfólió összetétele</h2>
            <div id="portfolioDate" class="portfolio-date"></div>
            <div class="chart-wrap">
              <img id="portfolioImage" class="portfolio-image" alt="Portfólió összetétele" loading="lazy" title="Kattints a kinagyításhoz">
              <div id="portfolioEmpty" class="portfolio-empty">Nincs portfóliódiagram.</div>
            </div>
          </div>

          <div class="source">
            <a id="sourceLink" href="#" target="_blank" rel="noopener noreferrer">Generali eszközalap-oldal</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Kinagyított kép modal (lightbox) -->
  <div id="imageModal" aria-hidden="true">
    <img id="modalImg" alt="Kinagyított diagram">
  </div>

  <button id="themeToggle" type="button" aria-label="Dark mode" title="Dark mode"></button>

  <script>
    const searchInput = document.getElementById("search");
    const clearSearch = document.getElementById("clearSearch");
    const fundSelect = document.getElementById("fundSelect");
    const resultCount = document.getElementById("resultCount");
    const fundName = document.getElementById("fundName");
    const dateBadge = document.getElementById("dateBadge");
    const returnValue = document.getElementById("returnValue");
    const referenceValue = document.getElementById("referenceValue");
    const portfolioDate = document.getElementById("portfolioDate");
    const portfolioImage = document.getElementById("portfolioImage");
    const portfolioEmpty = document.getElementById("portfolioEmpty");
    const sourceLink = document.getElementById("sourceLink");
    const themeToggle = document.getElementById("themeToggle");

    const myPortfolioBtn = document.getElementById("myPortfolioBtn");
    const myPortfolioList = document.getElementById("myPortfolioList");

    const imageModal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");

    let funds = [];
    let portfolio = {};
    let filteredFunds = [];

    const MY_PORTFOLIO_IDS = [
      "horizont-10",
      "hazai-reszveny",
      "tallozo",
      "innovacio"
    ];

    // Hozam érték és előjel szigorú normalizálása (kezeli a speciális mínuszjeleket: −, –, —)
    function parseReturn(val) {
      if (val === null || val === undefined || val === "") return null;
      if (typeof val === "number") return val;

      const str = String(val)
        .replace(/[−–—]/g, "-")
        .replace(",", ".")
        .replace("%", "")
        .trim();

      const num = parseFloat(str);
      return isNaN(num) ? null : num;
    }

    function formatReturnValue(val) {
      const num = parseReturn(val);
      if (num === null) {
        return { text: "Nincs adat", className: "neutral", val: -9999 };
      }

      if (num > 0) {
        return {
          text: `+${num.toFixed(2).replace(".", ",")}%`,
          className: "positive",
          val: num
        };
      } else if (num < 0) {
        return {
          text: `-${Math.abs(num).toFixed(2).replace(".", ",")}%`,
          className: "negative",
          val: num
        };
      } else {
        return {
          text: `0,00%`,
          className: "neutral",
          val: 0
        };
      }
    }

    function normalize(text) {
      return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function setThemeIcon() {
      const dark = document.documentElement.classList.contains("dark");

      themeToggle.innerHTML = dark
        ? `<svg viewBox="0 0 24 24" aria-hidden="true">
             <circle cx="12" cy="12" r="4"></circle>
             <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
           </svg>`
        : `<svg viewBox="0 0 24 24" aria-hidden="true">
             <path d="M21 12.8A8.5 8.5 0 0 1 11.2 3a8.5 8.5 0 1 0 9.8 9.8Z"></path>
           </svg>`;

      themeToggle.title = dark ? "Világos mód" : "Dark mode";
      themeToggle.setAttribute("aria-label", dark ? "Világos mód" : "Dark mode");
    }

    themeToggle.addEventListener("click", () => {
      const dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("generali-theme", dark ? "dark" : "light");
      setThemeIcon();
    });

    setThemeIcon();

    portfolioImage.addEventListener("click", () => {
      if (portfolioImage.src && portfolioImage.style.display !== "none") {
        modalImg.src = portfolioImage.src;
        imageModal.style.display = "flex";
      }
    });

    imageModal.addEventListener("click", () => {
      imageModal.style.display = "none";
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && imageModal.style.display === "flex") {
        imageModal.style.display = "none";
      }
    });

    myPortfolioBtn.addEventListener("click", () => {
      const isClosed = myPortfolioList.style.display === "" || myPortfolioList.style.display === "none";
      myPortfolioList.style.display = isClosed ? "block" : "none";
      myPortfolioBtn.classList.toggle("open", isClosed);
    });

    function renderMyPortfolio(fundList) {
      const matched = fundList.filter((f) => MY_PORTFOLIO_IDS.includes(f.id));

      matched.sort((a, b) => {
        const valA = formatReturnValue(a.ytd).val;
        const valB = formatReturnValue(b.ytd).val;
        return valB - valA;
      });

      myPortfolioList.innerHTML = "";

      matched.forEach((fund) => {
        const item = document.createElement("div");
        item.className = "my-portfolio-item";

        const formatted = formatReturnValue(fund.ytd);

        item.innerHTML = `
          <span class="my-portfolio-name">${fund.name}</span>
          <span class="my-portfolio-ytd ${formatted.className}">${formatted.text}</span>
        `;
        myPortfolioList.appendChild(item);
      });
    }

    function populateSelect(list) {
      const current = fundSelect.value;
      fundSelect.innerHTML = "";

      list.forEach((fund) => {
        const option = document.createElement("option");
        option.value = fund.id;
        option.textContent = fund.name;
        fundSelect.appendChild(option);
      });

      if (list.some((fund) => fund.id === current)) {
        fundSelect.value = current;
      }
    }

    function showFund(fund) {
      if (!fund) return;

      fundName.textContent = fund.name;
      dateBadge.textContent = fund.date ? `Adat: ${fund.date}` : "";

      const formatted = formatReturnValue(fund.ytd);
      returnValue.textContent = formatted.text;
      returnValue.className = formatted.className;

      sourceLink.href = fund.url;

      const data = portfolio[fund.id];

      if (!data) {
        referenceValue.textContent = "Nincs adat";
        portfolioDate.textContent = "";
        portfolioImage.removeAttribute("src");
        portfolioImage.style.display = "none";
        portfolioEmpty.style.display = "block";
        return;
      }

      referenceValue.textContent = data.reference_index || "Nincs adat";
      portfolioDate.textContent = data.portfolio_date
        ? `Portfólióadat dátuma: ${data.portfolio_date}`
        : "Statikus portfólióadat";

      if (data.portfolio_image) {
        portfolioImage.src = `${data.portfolio_image}?v=3`;
        portfolioImage.alt = `${fund.name} – portfólió összetétele`;
        portfolioImage.style.display = "block";
        portfolioEmpty.style.display = "none";
      } else {
        portfolioImage.removeAttribute("src");
        portfolioImage.style.display = "none";
        portfolioEmpty.style.display = "block";
      }
    }

    function applySearch() {
      const query = normalize(searchInput.value);

      filteredFunds = funds.filter((fund) => {
        return normalize(fund.name).includes(query);
      });

      populateSelect(filteredFunds);

      resultCount.textContent = query
        ? `${filteredFunds.length} találat`
        : `${funds.length} eszközalap`;

      clearSearch.style.display = query ? "block" : "none";

      if (filteredFunds.length === 1) {
        fundSelect.value = filteredFunds[0].id;
        showFund(filteredFunds[0]);
      } else if (filteredFunds.length > 0) {
        const current = filteredFunds.find((fund) => fund.id === fundSelect.value);
        showFund(current || filteredFunds[0]);
      } else {
        fundName.textContent = "Nincs találat";
        dateBadge.textContent = "";
        returnValue.textContent = "–";
        returnValue.className = "neutral";
        referenceValue.textContent = "–";
        portfolioDate.textContent = "";
        portfolioImage.removeAttribute("src");
        portfolioImage.style.display = "none";
        portfolioEmpty.style.display = "block";
      }
    }

    searchInput.addEventListener("input", applySearch);

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      applySearch();
      searchInput.focus();
    });

    fundSelect.addEventListener("change", () => {
      const selected = funds.find((fund) => fund.id === fundSelect.value);
      showFund(selected);
    });

    async function loadLastWorkflowRun() {
      const label = document.getElementById("workflow-last-run");
      if (!label) return;

      try {
        const pathSegments = window.location.pathname.split("/").filter(Boolean);
        let owner = window.location.hostname.split(".")[0];
        let repo = pathSegments[0] || "generali-hozamok";

        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
          repo = "generali-hozamok";
        }

        const res = await fetch(
          `https://api.github.com/repos/${owner}/${repo}/actions/runs?status=success&per_page=1`
        );

        if (!res.ok) throw new Error("API hiba");

        const data = await res.json();

        if (data.workflow_runs && data.workflow_runs.length > 0) {
          const runDate = new Date(data.workflow_runs[0].updated_at);
          label.textContent = runDate.toLocaleString("hu-HU", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            timeZone: "Europe/Budapest"
          });
        } else {
          label.textContent = "Nem elérhető";
        }
      } catch (_) {
        label.textContent = "Ismeretlen";
      }
    }

    loadLastWorkflowRun();

    Promise.all([
      fetch("funds.json", { cache: "no-store" }).then((r) => r.json()),
      fetch("portfolio.json", { cache: "no-store" }).then((r) => r.json())
    ])
      .then(([fundData, portfolioData]) => {
        funds = fundData;
        portfolio = portfolioData.funds || {};

        if (!Array.isArray(funds) || funds.length !== 18) {
          throw new Error("A funds.json nem 18 eszközalapot tartalmaz.");
        }

        filteredFunds = funds;
        populateSelect(funds);
        resultCount.textContent = `${funds.length} eszközalap`;
        showFund(funds[0]);

        renderMyPortfolio(funds);
      })
      .catch((error) => {
        console.error(error);
        document.getElementById("content").innerHTML =
          '<div class="error">Az adatok betöltése nem sikerült.</div>';
      });
  </script>
</body>
</html>
