<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generali eszközalapok</title>

  <script>
    (function () {
      try {
        if (localStorage.getItem("generali-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #161616;
      --muted: #6c727a;
      --border: #dfe2e6;
      --input: #ffffff;
      --accent: #b21f2d;
      --positive: #16833b;
      --negative: #bd1e2d;
      --shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    html.dark {
      --bg: #111315;
      --card: #1b1e21;
      --text: #f2f4f5;
      --muted: #aeb5bb;
      --border: #343a40;
      --input: #24282c;
      --accent: #ef5262;
      --positive: #49c978;
      --negative: #ff6878;
      --shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      transition: background .2s, color .2s;
    }

    .page {
      width: min(1100px, calc(100% - 28px));
      margin: 35px auto 70px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 26px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-wrap {
      position: relative;
    }

    #search,
    #fundSelect {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--input);
      color: var(--text);
      padding: 13px 15px;
      font-size: 16px;
      outline: none;
    }

    #search:focus,
    #fundSelect:focus {
      border-color: var(--accent);
    }

    #search {
      padding-right: 48px;
    }

    #clearSearch {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 20px;
      display: none;
    }

    .result-count {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .result {
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 25px;
    }

    #fundName {
      margin: 0;
      font-size: 23px;
    }

    .date {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .ytd-label {
      margin-top: 25px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #returnValue {
      margin: 5px 0 0;
      font-size: 46px;
      font-weight: 700;
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }
    .neutral { color: var(--muted); }

    .reference {
      margin: 24px auto 0;
      max-width: 850px;
      padding: 15px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: left;
    }

    .reference-title {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .reference-value {
      font-weight: 600;
      line-height: 1.45;
    }

    .portfolio {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 25px;
    }

    .portfolio h2 {
      margin: 0;
      font-size: 19px;
      text-align: left;
    }

    .portfolio-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .chart-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
    }

    #portfolioChart {
      display: block;
      width: 100%;
      min-width: 700px;
      height: 430px;
    }

    .source {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .source a {
      color: var(--accent);
    }

    .error {
      color: var(--negative);
      padding: 20px;
      text-align: center;
    }

    #themeToggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 10;
    }

    #themeToggle svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    @media (min-width: 700px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      .page {
        margin-top: 15px;
        width: min(100% - 16px, 1100px);
      }

      .card {
        padding: 18px 14px;
        border-radius: 14px;
      }

      h1 { font-size: 21px; }
      #returnValue { font-size: 38px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <h1>Generali eszközalapok</h1>
      <p class="subtitle">Forint alapú eszközalapok II. · év elejétől számított hozam</p>

      <div class="controls">
        <div>
          <div class="search-wrap">
            <input id="search" type="search" placeholder="Eszközalap keresése..." autocomplete="off">
            <button id="clearSearch" type="button" aria-label="Keresés törlése">×</button>
          </div>
          <div id="resultCount" class="result-count"></div>
        </div>

        <select id="fundSelect" aria-label="Eszközalap kiválasztása"></select>
      </div>

      <div id="content">
        <div class="result">
          <h2 id="fundName">Betöltés...</h2>
          <div id="dateBadge" class="date"></div>
          <div class="ytd-label">YTD hozam</div>
          <div id="returnValue" class="neutral">–</div>

          <div class="reference">
            <div class="reference-title">Referenciaindex</div>
            <div id="referenceValue" class="reference-value">–</div>
          </div>

          <div class="portfolio">
            <h2>Portfólió összetétele</h2>
            <div id="portfolioDate" class="portfolio-date"></div>
            <div class="chart-wrap">
              <svg id="portfolioChart" viewBox="0 0 1000 430" preserveAspectRatio="xMidYMid meet"></svg>
            </div>
          </div>

          <div class="source">
            <a id="sourceLink" href="#" target="_blank" rel="noopener noreferrer">Generali eszközalap-oldal</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <button id="themeToggle" type="button" aria-label="Dark mode" title="Dark mode"></button>

  <script>
    const searchInput = document.getElementById("search");
    const clearSearch = document.getElementById("clearSearch");
    const fundSelect = document.getElementById("fundSelect");
    const resultCount = document.getElementById("resultCount");
    const fundName = document.getElementById("fundName");
    const dateBadge = document.getElementById("dateBadge");
    const returnValue = document.getElementById("returnValue");
    const referenceValue = document.getElementById("referenceValue");
    const portfolioDate = document.getElementById("portfolioDate");
    const portfolioChart = document.getElementById("portfolioChart");
    const sourceLink = document.getElementById("sourceLink");
    const themeToggle = document.getElementById("themeToggle");

    let funds = [];
    let portfolio = {};
    let filteredFunds = [];

    function normalize(text) {
      return String(text || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function setThemeIcon() {
      const dark = document.documentElement.classList.contains("dark");

      themeToggle.innerHTML = dark
        ? `<svg viewBox="0 0 24 24" aria-hidden="true">
             <circle cx="12" cy="12" r="4"></circle>
             <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
           </svg>`
        : `<svg viewBox="0 0 24 24" aria-hidden="true">
             <path d="M21 12.8A8.5 8.5 0 0 1 11.2 3a8.5 8.5 0 1 0 9.8 9.8Z"></path>
           </svg>`;

      themeToggle.title = dark ? "Világos mód" : "Dark mode";
      themeToggle.setAttribute("aria-label", dark ? "Világos mód" : "Dark mode");
    }

    themeToggle.addEventListener("click", () => {
      const dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("generali-theme", dark ? "dark" : "light");
      setThemeIcon();
    });

    setThemeIcon();

    function populateSelect(list) {
      const current = fundSelect.value;
      fundSelect.innerHTML = "";

      list.forEach((fund) => {
        const option = document.createElement("option");
        option.value = fund.id;
        option.textContent = fund.name;
        fundSelect.appendChild(option);
      });

      if (list.some((fund) => fund.id === current)) {
        fundSelect.value = current;
      }
    }

    function showFund(fund) {
      if (!fund) return;

      fundName.textContent = fund.name;
      dateBadge.textContent = fund.date ? `Adat: ${fund.date}` : "";

      if (fund.ytd === null || fund.ytd === undefined) {
        returnValue.textContent = "Nincs adat";
        returnValue.className = "neutral";
      } else {
        const sign = fund.ytd > 0 ? "+" : "";
        returnValue.textContent = `${sign}${fund.ytd.toFixed(2).replace(".", ",")}%`;
        returnValue.className = fund.ytd > 0
          ? "positive"
          : fund.ytd < 0
            ? "negative"
            : "neutral";
      }

      sourceLink.href = fund.url;

      const data = portfolio[fund.id];

      if (!data) {
        referenceValue.textContent = "Nincs adat";
        portfolioDate.textContent = "";
        portfolioChart.innerHTML = "";
        return;
      }

      referenceValue.textContent = data.reference_index || "Nincs adat";
      portfolioDate.textContent = data.portfolio_date
        ? `Portfólióadat dátuma: ${data.portfolio_date}`
        : "Statikus portfólióadat";

      drawPortfolio(data.portfolio || []);
    }

    function drawPortfolio(items) {
      portfolioChart.innerHTML = "";

      if (!items.length) {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", "500");
        text.setAttribute("y", "215");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "currentColor");
        text.textContent = "Nincs portfólióadat";
        portfolioChart.appendChild(text);
        return;
      }

      const width = 1000;
      const height = 430;
      const cx = 390;
      const cy = 215;
      const outer = 128;
      const inner = 78;

      const colors = [
        "#b35b63", "#6e1726", "#e48a6c", "#276d7b",
        "#b7b9ba", "#7f1d1d", "#dfad73", "#3e6f76",
        "#9e9e9e", "#d96d4e", "#6b3d42", "#5c8d8a",
        "#8f6b5b", "#b77c82", "#4d5960"
      ];

      const total = items.reduce((sum, item) => sum + Number(item.percentage || 0), 0);
      let angle = -Math.PI / 2;

      function polar(r, a) {
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      }

      function pathFor(start, end) {
        const large = end - start > Math.PI ? 1 : 0;
        const [x1, y1] = polar(outer, start);
        const [x2, y2] = polar(outer, end);
        const [ix1, iy1] = polar(inner, end);
        const [ix2, iy2] = polar(inner, start);

        return [
          `M ${x1} ${y1}`,
          `A ${outer} ${outer} 0 ${large} 1 ${x2} ${y2}`,
          `L ${ix1} ${iy1}`,
          `A ${inner} ${inner} 0 ${large} 0 ${ix2} ${iy2}`,
          "Z"
        ].join(" ");
      }

      items.forEach((item, index) => {
        const value = Number(item.percentage || 0);
        const sweep = (value / total) * Math.PI * 2;
        const end = angle + sweep;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathFor(angle, end));
        path.setAttribute("fill", colors[index % colors.length]);
        path.setAttribute("stroke", getComputedStyle(document.body).backgroundColor);
        path.setAttribute("stroke-width", "2");
        portfolioChart.appendChild(path);

        const mid = angle + sweep / 2;
        const side = Math.cos(mid) >= 0 ? 1 : -1;

        const p1 = polar(outer + 5, mid);
        const p2 = polar(outer + 30, mid);
        const p3 = [side > 0 ? 705 : 75, p2[1]];

        const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        line.setAttribute("points", `${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${p3[0]},${p3[1]}`);
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", "#aeb2b5");
        line.setAttribute("stroke-width", "1");
        portfolioChart.appendChild(line);

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", side > 0 ? 720 : 60);
        label.setAttribute("y", p3[1] + 5);
        label.setAttribute("text-anchor", side > 0 ? "start" : "end");
        label.setAttribute("font-size", "16");
        label.setAttribute("fill", "currentColor");

        const name = item.name || "Ismeretlen";
        const shortened = name.length > 23 ? name.slice(0, 22) + "…" : name;
        label.textContent = `${shortened} ${value.toFixed(2).replace(".", ",")}%`;
        portfolioChart.appendChild(label);

        angle = end;
      });

      const center = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      center.setAttribute("cx", cx);
      center.setAttribute("cy", cy);
      center.setAttribute("r", inner);
      center.setAttribute("fill", getComputedStyle(document.body).getPropertyValue("--card"));
      portfolioChart.appendChild(center);
    }

    function applySearch() {
      const query = normalize(searchInput.value);

      filteredFunds = funds.filter((fund) => {
        return normalize(fund.name).includes(query);
      });

      populateSelect(filteredFunds);

      resultCount.textContent = query
        ? `${filteredFunds.length} találat`
        : `${funds.length} eszközalap`;

      clearSearch.style.display = query ? "block" : "none";

      if (filteredFunds.length === 1) {
        fundSelect.value = filteredFunds[0].id;
        showFund(filteredFunds[0]);
      } else if (filteredFunds.length > 0) {
        const current = filteredFunds.find((fund) => fund.id === fundSelect.value);
        showFund(current || filteredFunds[0]);
      } else {
        fundName.textContent = "Nincs találat";
        dateBadge.textContent = "";
        returnValue.textContent = "–";
        returnValue.className = "neutral";
        referenceValue.textContent = "–";
        portfolioDate.textContent = "";
        portfolioChart.innerHTML = "";
      }
    }

    searchInput.addEventListener("input", applySearch);

    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      applySearch();
      searchInput.focus();
    });

    fundSelect.addEventListener("change", () => {
      const selected = funds.find((fund) => fund.id === fundSelect.value);
      showFund(selected);
    });

    Promise.all([
      fetch("funds.json", { cache: "no-store" }).then((r) => r.json()),
      fetch("portfolio.json", { cache: "no-store" }).then((r) => r.json())
    ])
      .then(([fundData, portfolioData]) => {
        funds = fundData;
        portfolio = portfolioData;

        if (!Array.isArray(funds) || funds.length !== 18) {
          throw new Error("A funds.json nem 18 eszközalapot tartalmaz.");
        }

        filteredFunds = funds;
        populateSelect(funds);
        resultCount.textContent = `${funds.length} eszközalap`;
        showFund(funds[0]);
      })
      .catch((error) => {
        console.error(error);
        document.getElementById("content").innerHTML =
          '<div class="error">Az adatok betöltése nem sikerült.</div>';
      });
  </script>
</body>
</html>
