name: Update Generali Funds Data

on:
  schedule:
    - cron: '0 18 * * 1-5'  # Minden hétköznap 18:00 UTC (este)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add funds.json history.json
          git commit -m "Auto-update funds and portfolio history [skip ci]" || echo "Nincs új változás"
          git push
