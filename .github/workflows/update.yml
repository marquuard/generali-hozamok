name: Generali hozamok frissítése

on:
  workflow_dispatch:

  schedule:
    # Napi 3 automatikus futás
    # 06:15 UTC
    # 14:15 UTC
    # 22:15 UTC
    - cron: "15 6 * * *"
    - cron: "15 14 * * *"
    - cron: "15 22 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "funds.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:

  update-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Repository letöltése
      # ======================================================

      - name: Repository letöltése
        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ======================================================
      # Generali adatok lekérése
      # ======================================================

      - name: Generali adatok lekérése
        run: |
          python scraper.py


      # ======================================================
      # funds.json ellenőrzése
      # ======================================================

      - name: Adatok ellenőrzése
        run: |
          python - <<'PY'
          import json

          EXPECTED_FUNDS = 18

          with open(
              "funds.json",
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          if not isinstance(data, list):
              raise SystemExit(
                  "A funds.json nem lista."
              )

          if len(data) == 0:
              raise SystemExit(
                  "A funds.json üres."
              )

          if len(data) != EXPECTED_FUNDS:
              raise SystemExit(
                  f"Hibás eszközalap-darabszám: "
                  f"{len(data)}. "
                  f"Elvárt: {EXPECTED_FUNDS}."
              )

          required = {
              "id",
              "name",
              "ytd",
              "url"
          }

          no_ytd = []

          for index, fund in enumerate(data):

              missing = required - set(
                  fund.keys()
              )

              if missing:
                  raise SystemExit(
                      f"Hibás rekord #{index}: "
                      f"hiányzó mezők: "
                      f"{missing}"
                  )

              # A YTD lehet:
              # - int
              # - float
              # - null
              #
              # A null azt jelenti, hogy a Generali
              # jelenleg nem közöl YTD adatot az alaphoz.

              ytd = fund["ytd"]

              if ytd is not None and not isinstance(
                  ytd,
                  (int, float)
              ):
                  raise SystemExit(
                      f"Hibás YTD érték: "
                      f"{fund['name']}: "
                      f"{ytd!r}"
                  )

              if ytd is None:
                  no_ytd.append(
                      fund["name"]
                  )

          print(
              f"Érvényes eszközalapok: "
              f"{len(data)}"
          )

          if no_ytd:
              print()
              print(
                  "YTD adattal jelenleg nem rendelkező "
                  "eszközalap(ok):"
              )

              for name in no_ytd:
                  print(
                      f"  - {name}"
                  )

          print()
          print(
              "A funds.json ellenőrzése sikeres."
          )
          PY


      # ======================================================
      # Változások mentése
      # ======================================================

      - name: Változások mentése
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add funds.json

          if git diff --cached --quiet; then
            echo "A hozamadatok nem változtak."
          else
            git commit \
              -m "Automatikus hozam frissítés"

            git push
          fi


      # ======================================================
      # GitHub Pages artifact
      # ======================================================

      - name: GitHub Pages artifact készítése
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      # ======================================================
      # GitHub Pages publikálása
      # ======================================================

      - name: GitHub Pages publikálása
        uses: actions/deploy-pages@v4
