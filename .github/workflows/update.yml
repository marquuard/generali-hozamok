name: Generali hozamok frissítése

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * *"
    - cron: "15 14 * * *"
    - cron: "15 22 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "funds.json"
      - "portfolio.json"
      - "portfolio_images/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python csomagok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow opencv-python-headless playwright

      - name: Statikus portfólióadatok frissítési állapotának ellenőrzése
        id: portfolio_check
        shell: bash
        run: |
          if [ ! -f portfolio.json ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Nincs portfolio.json: első betöltés szükséges."
            exit 0
          fi

          VERSION=$(python - <<'PY'
          import json

          try:
              with open("portfolio.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              print(data.get("_version", 0))
          except Exception:
              print(0)
          PY
          )

          if [ "$VERSION" != "3" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Régi portfolio.json verzió: $VERSION. Újraépítés szükséges."
          else
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "A statikus portfólióadatok aktuálisak."
          fi

      - name: Playwright Chromium telepítése
        if: steps.portfolio_check.outputs.refresh == 'true'
        run: |
          playwright install --with-deps chromium

      - name: Régi statikus portfólió törlése újraépítés előtt
        if: steps.portfolio_check.outputs.refresh == 'true'
        run: |
          rm -f portfolio.json
          rm -rf portfolio_images
          mkdir -p portfolio_images

      - name: Statikus referenciaindexek és portfóliódiagramok egyszeri lekérése
        if: steps.portfolio_check.outputs.refresh == 'true'
        run: |
          python portfolio_init.py

      - name: Generali YTD adatok lekérése
        run: |
          python scraper.py

      - name: Adatok ellenőrzése
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          with open("funds.json", "r", encoding="utf-8") as file:
              funds = json.load(file)

          if not isinstance(funds, list) or len(funds) != 18:
              raise SystemExit(
                  f"A funds.json nem pontosan 18 rekordot tartalmaz: "
                  f"{len(funds) if isinstance(funds, list) else 'nem lista'}"
              )

          required = {"id", "name", "ytd", "date", "url"}

          for index, fund in enumerate(funds):
              missing = required - set(fund.keys())
              if missing:
                  raise SystemExit(
                      f"Hibás funds rekord #{index}: {missing}"
                  )

              if fund["ytd"] is not None and not isinstance(
                  fund["ytd"], (int, float)
              ):
                  raise SystemExit(
                      f"Hibás YTD érték: {fund['name']}"
                  )

          with open("portfolio.json", "r", encoding="utf-8") as file:
              portfolio_file = json.load(file)

          if portfolio_file.get("_version") != 3:
              raise SystemExit("A portfolio.json nem a v3 formátum.")

          portfolio = portfolio_file.get("funds", {})

          if len(portfolio) != 18:
              raise SystemExit(
                  f"A portfolio.json nem pontosan 18 eszközalapot tartalmaz: "
                  f"{len(portfolio)}"
              )

          for fund in funds:
              item = portfolio.get(fund["id"])
              if not item:
                  raise SystemExit(
                      f"Hiányzó portfóliórekord: {fund['name']}"
                  )

              if not item.get("reference_index"):
                  raise SystemExit(
                      f"Hiányzó referenciaindex: {fund['name']}"
                  )

              image = item.get("portfolio_image")
              if not image:
                  raise SystemExit(
                      f"Hiányzó portfóliódiagram: {fund['name']}"
                  )

              if not Path(image).exists():
                  raise SystemExit(
                      f"A portfóliókép fájlja nem létezik: {image}"
                  )

          print("18 YTD rekord, 18 referenciaindex és 18 portfóliódiagram rendben.")
          PY

      - name: Változások mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add funds.json portfolio.json portfolio_images

          if git diff --cached --quiet; then
            echo "Nincs mentendő változás."
          else
            git commit -m "Automatikus Generali adatfrissítés"
            git push
          fi

      - name: GitHub Pages artifact készítése
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages publikálása
        uses: actions/deploy-pages@v4
