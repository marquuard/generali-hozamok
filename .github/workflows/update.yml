name: Generali hozamok frissítése

on:
  workflow_dispatch:

  schedule:
    - cron: "15 6 * * *"
    - cron: "15 14 * * *"
    - cron: "15 22 * * *"

  push:
    branches:
      - main
    paths-ignore:
      - "funds.json"
      - "portfolio.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Alap Python csomagok
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Statikus portfólió és referenciaindex egyszeri betöltése
        run: |
          if [ ! -f portfolio.json ]; then
            pip install playwright
            playwright install --with-deps chromium
            python portfolio_init.py
          else
            echo "A portfolio.json már létezik, nem kérjük le újra."
          fi

      - name: Generali YTD adatok lekérése
        run: |
          python scraper.py

      - name: Adatok ellenőrzése
        run: |
          python - <<'PY'
          import json

          with open("funds.json", "r", encoding="utf-8") as file:
              funds = json.load(file)

          if not isinstance(funds, list):
              raise SystemExit("A funds.json nem lista.")

          if len(funds) != 18:
              raise SystemExit(
                  f"A funds.json nem pontosan 18 rekordot tartalmaz: {len(funds)}"
              )

          required = {"id", "name", "ytd", "date", "url"}

          for index, fund in enumerate(funds):
              missing = required - set(fund.keys())

              if missing:
                  raise SystemExit(
                      f"Hibás rekord #{index}: hiányzó mezők: {missing}"
                  )

              if fund["ytd"] is not None and not isinstance(
                  fund["ytd"], (int, float)
              ):
                  raise SystemExit(
                      f"Hibás YTD érték: {fund['name']}"
                  )

          with open("portfolio.json", "r", encoding="utf-8") as file:
              portfolio = json.load(file)

          if not isinstance(portfolio, dict):
              raise SystemExit("A portfolio.json nem objektum.")

          if len(portfolio) != 18:
              raise SystemExit(
                  f"A portfolio.json nem pontosan 18 eszközalapot tartalmaz: {len(portfolio)}"
              )

          for fund_id, data in portfolio.items():
              if not data.get("portfolio"):
                  raise SystemExit(
                      f"Nincs portfólióadat: {fund_id}"
                  )

          print("18 YTD rekord és 18 statikus portfólió rendben.")
          PY

      - name: Változások mentése
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add funds.json portfolio.json

          if git diff --cached --quiet; then
            echo "Nincs mentendő változás."
          else
            git commit -m "Automatikus Generali adatfrissítés"
            git push
          fi

      - name: GitHub Pages artifact készítése
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages publikálása
        uses: actions/deploy-pages@v4
